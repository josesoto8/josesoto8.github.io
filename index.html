<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>josesoto8</title>
    <style>
        /* Configuración base y fondo */
        body {
            background-color: #f3f3eb; /* Ajusta al tono exacto de tu web */
            color: #000;
            font-family: monospace; /* Cambia por la fuente que estés usando */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ocupa toda la altura de la pantalla */
        }

        /* Encabezado distribuido en 3 columnas (Logo - Menú - Tema) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 5rem;
        }

        .logo-header img {
            height: 40px; /* Tamaño del logo en la esquina */
            width: auto;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a, nav span {
            text-decoration: none;
            color: #000;
        }

        .icono-tema {
            cursor: pointer;
        }

        /* Contenedor central (ocupa el espacio sobrante y centra su contenido) */
        main {
            flex: 1; /* Empuja el header arriba y el footer abajo */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-central {
            max-width: 250px; /* Controla que el logo principal no se haga gigante */
            height: auto;
        }

        /* Pie de página centrado */
        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            gap: 15px;
            font-size: 0.9rem;
        }

        .visitas {
            background-color: #000;
            color: #fff;
            padding: 5px 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Encabezado superior -->
    <header>
        <div class="logo-header">
            <img src="ruta-a-tu-logo.svg" alt="José Soto">
        </div>
        
        <nav>
            <span>|</span>
            <a href="index.html">Inicio</a> <span>|</span>
            <a href="Download.html">Descargas</a> <span>|</span>
            <a href="acerca.html">Acerca de</a>
        </nav>
        
        <div class="icono-tema">
            "icono tema"
        </div>
    </header>

    <!-- Centro de la página (Solo el logo, sin los íconos de las apps) -->
    <main>
        <img src="ruta-a-tu-logo.svg" alt="José Soto" class="logo-central">
    </main>

    <!-- Pie de página -->
    <footer>
        <div class="visitas">VISITAS  350</div>
        <div>2026. José Soto</div>
    </footer>

</body>
</html>
